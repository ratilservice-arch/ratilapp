<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c3e50">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="RATIL">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>Ratil Service Esthétique - الرئيسية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            color: #e67e22;
            font-weight: bold;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .option-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #e67e22;
        }
        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .option-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .option-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .btn-action {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RATIL SERVICE ESTHÉTIQUE</h1>
        <p>خلي صالونك ديما جديد مع Ratil</p>
    </div>

    <!-- خيار متجر الأجهزة وقطع الغيار -->
    <div class="option-card">
        <div class="icon">🛒</div>
        <div class="option-title">متجر الأجهزة وقطع الغيار</div>
        <div class="option-desc">تصفح أحدث أجهزة التجميل والعناية بالبشرة، واطلب قطع الغيار الأصلية والمستلزمات مباشرة.</div>
        <a href="store.html" class="btn-action">تصفح المتجر</a>
    </div>

    <!-- خيار طلب الصيانة -->
    <div class="option-card">
        <div class="icon">🛠️</div>
        <div class="option-title">طلب صيانة وإصلاح</div>
        <div class="option-desc">هل لديك جهاز معطل؟ أرسل طلب صيانة مع توضيح العطل وسنتواصل معك فوراً لإصلاحه.</div>
        <a href="maintenance.html" class="btn-action">طلب صيانة فورية</a>
    </div>
</div>

    <script src="./pwa.js" defer></script>
</body>
</html>
