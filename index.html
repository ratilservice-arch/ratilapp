<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c3e50">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="RATIL">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>RATIL SERVICE ESTHÉTIQUE</title>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .slogan {
            font-size: 14px;
            color: #e67e22;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">RATIL SERVICE</div>
        <div class="slogan">خلي صالونك ديما جديد مع Ratil</div>
        
        <form action="main.html" method="GET"> 
            <div class="form-group">
                <label>اسم الصالون / المركز</label>
                <input type="text" placeholder="مثال: صالون الأناقة">
            </div>
            
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" placeholder="06XX XX XX XX">
            </div>
            
            <div class="form-group">
                <label>الولاية / المدينة</label>
                <input type="text" placeholder="ادخل مدينتك">
            </div>
            
            <button type="submit" class="btn-submit">الدخول للتطبيق</button>
        </form>
    </div>

    <script src="./pwa.js" defer></script>
</body>
</html>
